name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish npm + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Validate sources
        run: |
          node --check client/client.js
          node --check lib/index.js
          node --check host-source.js
          node --check client-source.js
          node -e "const m=require('./manifest.json'); const p=require('./package.json'); if(m.version!==p.version) throw new Error('version mismatch: manifest='+m.version+' pkg='+p.version); console.log('versions aligned:', p.version)"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
